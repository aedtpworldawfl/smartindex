    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0d10;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #e8edf2;
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }

        /* ----- FIXED HEADER ----- */
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(11, 13, 16, 0.88);
            backdrop-filter: blur(14px) saturate(1.3);
            -webkit-backdrop-filter: blur(14px) saturate(1.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0 2rem;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            transition: background 0.2s;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }

        .brand-name {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0b45a, #f7d78c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(240, 180, 90, 0.15);
        }

        .brand-link {
            font-size: 0.85rem;
            font-weight: 450;
            color: #a8b3c9;
            text-decoration: none;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding-left: 0.9rem;
            transition: color 0.2s, border-color 0.2s;
            letter-spacing: 0.01em;
        }
        .brand-link:hover {
            color: #f0d48a;
            border-color: rgba(240, 180, 90, 0.3);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        nav a {
            color: #a8b3c9;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 480;
            padding: 0.4rem 0.9rem;
            border-radius: 40px;
            transition: all 0.2s ease;
            letter-spacing: 0.01em;
            background: transparent;
        }
        nav a:hover {
            color: #f0f4fa;
            background: rgba(255, 255, 255, 0.05);
        }
        nav a.active {
            color: #fff;
            background: rgba(240, 180, 90, 0.18);
            box-shadow: inset 0 0 0 1px rgba(240, 180, 90, 0.15);
        }

        /* ----- SPACER FOR FIXED HEADER ----- */
        .header-spacer {
            height: 68px;
            /* matches header height */
        }

        /* ----- MAIN CONTAINER ----- */
        #awflmeta-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.8rem 2rem 4rem;
        }

        /* ----- LOADER / STATUS ----- */
        #status {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50vh;
            font-size: 1rem;
            color: #7a879e;
            letter-spacing: 0.02em;
        }

        .loader-dots {
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }
        .loader-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f0b45a;
            display: inline-block;
            animation: pulse-dot 1.2s ease-in-out infinite;
        }
        .loader-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .loader-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse-dot {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ----- AWFLMETA CARD ----- */
        .awflmeta-card {
            background: rgba(22, 26, 34, 0.75);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            padding: 2rem 2.2rem;
            margin-bottom: 3rem;
            transition: border-color 0.25s, box-shadow 0.25s;
            min-height: 100vh;
            /* 100vh per fetch as requested */
            display: flex;
            flex-direction: column;
        }
        .awflmeta-card:hover {
            border-color: rgba(240, 180, 90, 0.12);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.55);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem 1.5rem;
            padding-bottom: 1.2rem;
            margin-bottom: 1.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .card-header h2 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #e8edf2, #bcc7dc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            word-break: break-word;
        }
        .card-tag {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #f0b45a;
            background: rgba(240, 180, 90, 0.12);
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            border: 1px solid rgba(240, 180, 90, 0.12);
            white-space: nowrap;
        }
        .card-tag.error {
            color: #ff6b4a;
            background: rgba(255, 80, 50, 0.12);
            border-color: rgba(255, 80, 50, 0.15);
        }

        /* ----- CONTENT INSIDE CARD (from fetched HTML) ----- */
        .awflmeta-content {
            flex: 1;
            font-size: 0.98rem;
            line-height: 1.7;
            color: #d0d8e6;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        /* style any raw HTML from the fetched wiki pages */
        .awflmeta-content h1,
        .awflmeta-content h2,
        .awflmeta-content h3,
        .awflmeta-content h4 {
            color: #f0f4fa;
            margin: 1.4rem 0 0.6rem;
            font-weight: 500;
            letter-spacing: -0.01em;
        }
        .awflmeta-content h1 {
            font-size: 2rem;
        }
        .awflmeta-content h2 {
            font-size: 1.6rem;
        }
        .awflmeta-content h3 {
            font-size: 1.3rem;
        }
        .awflmeta-content p {
            margin: 0.75rem 0;
        }
        .awflmeta-content a {
            color: #f0b45a;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .awflmeta-content a:hover {
            border-bottom-color: #f0b45a;
        }
        .awflmeta-content img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 0.8rem 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .awflmeta-content ul,
        .awflmeta-content ol {
            padding-left: 1.6rem;
            margin: 0.6rem 0;
        }
        .awflmeta-content li {
            margin: 0.3rem 0;
        }
        .awflmeta-content blockquote {
            border-left: 3px solid rgba(240, 180, 90, 0.3);
            padding-left: 1.2rem;
            margin: 1rem 0;
            color: #b0bacf;
        }
        .awflmeta-content pre,
        .awflmeta-content code {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 8px;
            padding: 0.2rem 0.5rem;
            font-size: 0.9em;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            color: #e8edf2;
        }
        .awflmeta-content pre {
            padding: 1rem;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .awflmeta-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
        }
        .awflmeta-content th,
        .awflmeta-content td {
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.5rem 0.8rem;
            text-align: left;
        }
        .awflmeta-content th {
            background: rgba(255, 255, 255, 0.04);
            font-weight: 500;
        }

        /* ----- DIVIDER (accent) ----- */
        .awfl-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin: 1.2rem 0 2.8rem;
            color: rgba(255, 255, 255, 0.08);
            user-select: none;
        }
        .awfl-divider hr {
            flex: 1;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(240, 180, 90, 0.2), rgba(240, 180, 90, 0.08), transparent);
        }
        .awfl-divider .divider-icon {
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: rgba(240, 180, 90, 0.2);
            font-weight: 300;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 820px) {
            .fixed-header {
                padding: 0 1.2rem;
                height: 62px;
                flex-wrap: wrap;
            }
            .header-spacer {
                height: 62px;
            }
            .brand {
                gap: 0.3rem;
            }
            .brand-name {
                font-size: 1.1rem;
            }
            .brand-link {
                font-size: 0.7rem;
                padding-left: 0.5rem;
            }
            nav a {
                font-size: 0.7rem;
                padding: 0.3rem 0.6rem;
            }
            #awflmeta-container {
                padding: 1rem 1rem 3rem;
            }
            .awflmeta-card {
                padding: 1.4rem 1.2rem;
                min-height: 90vh;
            }
            .card-header h2 {
                font-size: 1.3rem;
            }
            .card-tag {
                font-size: 0.6rem;
                padding: 0.2rem 0.6rem;
            }
        }

        @media (max-width: 520px) {
            .fixed-header {
                height: 56px;
                padding: 0 0.8rem;
            }
            .header-spacer {
                height: 56px;
            }
            .brand-name {
                font-size: 0.95rem;
            }
            .brand-link {
                font-size: 0.6rem;
                padding-left: 0.4rem;
                max-width: 130px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            nav a {
                font-size: 0.6rem;
                padding: 0.2rem 0.5rem;
            }
            .awflmeta-card {
                padding: 1rem 0.9rem;
                min-height: 80vh;
                border-radius: 14px;
            }
            .card-header h2 {
                font-size: 1.1rem;
            }
            #awflmeta-container {
                padding: 0.8rem 0.6rem 2rem;
            }
            .awfl-divider .divider-icon {
                font-size: 0.6rem;
            }
        }

        /* scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0d10;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(240, 180, 90, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(240, 180, 90, 0.5);
        }

        /* utility */
        .text-muted {
            color: #7a879e;
        }
        .text-center {
            text-align: center;
        }
        .mt-2 {
            margin-top: 2rem;
        }
    </style>

<body>

    <!-- ===== FIXED HEADER ===== -->
    <header class="fixed-header" role="banner">
        <div class="header-left">
            <div class="brand">
                <span class="brand-name">AWFLMETA</span>
                <a class="brand-link" href="https://aedtpworld.com/">
                    AEDTP WORLD FREE LICENSE (AWFL) WIKI
                </a>
            </div>

        </div>
        <nav aria-label="Main navigation">
            <a href="https://aedtpworld.com/awflmeta/">Home</a>
 
            <a href="https://aedtpworld.com/wiki/awflmeta.php" class="active">Update News</a>

            <a href="https://aedtpworld.com/wiki/"    target="_blank" >Create</a>

            <a href="https://aedtpworld.com/awfl/index.php"    target="_blank" >Upload</a>
            
            <a href="https://aedtpworld.com/wiki/awflmeta.php">Refresh</a>


        </nav>
    </header>

    <!-- ===== SPACER (prevents content from hiding behind fixed header) ===== -->
    <div class="header-spacer"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <main id="awflmeta-container" role="main">
        <!-- status / loader -->
        <div id="status" aria-live="polite">
            <span class="loader-dots">
                <span></span><span></span><span></span>
            </span>
            &nbsp; loading AWFLMETA pages …
        </div>

        <!-- cards will be injected here -->
    </main>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('awflmeta-container');
            const status = document.getElementById('status');

            /**
             * Create an accent divider (hr with decoration)
             */
            function createDivider() {
                const div = document.createElement('div');
                div.className = 'awfl-divider';
                div.innerHTML = `
                    <hr />
                    <span class="divider-icon">🌐</span>
                    <hr />
                `;
                return div;
            }

            /**
             * Load and render all AWFLMETA pages
             */
            async function loadawflmetaPages() {
                try {
                    // 1. Fetch index.json
                    const indexRes = await fetch('https://aedtpworld.com/wiki/awflmeta.json');
                    if (!indexRes.ok) throw new Error(`index.json fetch failed: ${indexRes.status}`);
                    const pages = await indexRes.json();

                    // Hide loader
                    status.style.display = 'none';

                    if (!pages || !pages.length) {
                        container.innerHTML =
                            `<p style="padding:40px 0; color:#7a879e; font-family:monospace; text-align:center;">No AWFLMETA pages found.</p>`;
                        return;
                    }

                    // 2. Loop through each awflmeta entry
                    for (let i = 0; i < pages.length; i++) {
                        const item = pages[i];
                        try {
                            const htmlRes = await fetch(`https://aedtpworld.com/wiki/${item.file}`);
                            if (!htmlRes.ok) throw new Error(`${item.file} fetch failed: ${htmlRes.status}`);
                            const rawHtml = await htmlRes.text();

                            // 3. Parse and extract body content only
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(rawHtml, 'text/html');
                            const bodyContent = doc.body ? doc.body.innerHTML : rawHtml;

                            // 4. Inject card
                            const card = document.createElement('div');
                            card.className = 'awflmeta-card';
                            card.innerHTML = `
                                <div class="card-header">
                                    <h2>${escapeHtml(item.name)}</h2>
                                    <span class="card-tag">AWFLMETA</span>
                                </div>
                                <div class="awflmeta-content">
                                    ${bodyContent}
                                </div>
                            `;
                            container.appendChild(card);

                        } catch (err) {
                            console.warn(`Could not load https://aedtpworld.com/wiki/${item.file}:`, err);
                            const errCard = document.createElement('div');
                            errCard.className = 'awflmeta-card';
                            errCard.innerHTML = `
                                <div class="card-header">
                                    <h2>${escapeHtml(item.name)}</h2>
                                    <span class="card-tag error">ERROR</span>
                                </div>
                                <div class="awflmeta-content" style="color:#7a879e;font-family:monospace;font-size:0.9rem;padding:1.2rem 0;">
                                    ⚠ Could not load AWFLMETA for <strong style="color:#a8b3c9;">${escapeHtml(item.name)}</strong>.
                                    <br /><span style="font-size:0.8rem;color:#5a677e;">${escapeHtml(err.message || 'unknown error')}</span>
                                </div>
                            `;
                            container.appendChild(errCard);
                        }

                        // 5. Add divider after every fetch (except the last one)
                        if (i < pages.length - 1) {
                            container.appendChild(createDivider());
                        }
                    }

                } catch (err) {
                    status.innerHTML =
                        `<span style="color:#ff6b4a; display:flex; align-items:center; gap:0.5rem;">⚠ Failed to load AWFLMETA index: ${escapeHtml(err.message)}</span>`;
                    console.error(err);
                }
            }

            /**
             * Simple escape to prevent XSS from page names
             */
            function escapeHtml(str) {
                if (!str) return '';
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return String(str).replace(/[&<>"']/g, function(m) { return map[m]; });
            }

            // kick off
            loadawflmetaPages();

        })();
    </script>
