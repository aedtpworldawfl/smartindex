<body>
    <header class="topbar">
        <a href="/tools/" class="brand">TOOLS <span class="brand-tag">AEDTP WORLD</span></a>
        <nav class="nav-links" id="nav-auth-slot">
            <a href="/tools/help/">Help</a>
            <a href="/tools/about/">About</a>
        </nav>
    </header>

    <main class="wrap">
        <p class="eyebrow">Directory</p>
        <h1>Open a tool <span>instantly</span>.</h1>
        <p class="lede">Every tile below is a self-contained tool folder. Tap one to open it — nothing to install, nothing to sign up for.</p>

        <div id="tool-grid" class="tool-grid" aria-live="polite">
            <div class="empty-state">Loading tools…</div>
        </div>
    </main>

    <footer>
        <a href="/tools/help/">Help center</a> · <a href="/tools/about/">About TOOLS</a> · © AEDTP WORLD
    </footer>

    <script src="/tools/assets/app.js"></script>
    <script>
      async function loadTools() {
        const grid = document.getElementById('tool-grid');
        const { data } = await apiCall('list_tools');
        const tools = (data && data.ok && Array.isArray(data.tools)) ? data.tools : [];

        if (tools.length === 0) {
          grid.innerHTML = `<div class="empty-state">No tools uploaded yet. Check back soon.</div>`;
          return;
        }

        grid.innerHTML = tools.map(t => `
          <a class="tool-tile" href="/tools/${encodeURIComponent(t.link)}/">
            <span class="tt-name">${escapeHtml(t.name)}</span>
            <span class="tt-path">/tools/${escapeHtml(t.link)}/</span>
            <span class="tt-open">Open tool →</span>
          </a>
        `).join('');
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      loadTools();
      mountAuthNav();
    </script>
</body>
