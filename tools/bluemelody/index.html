  <script>
    /* =====================================================
     * Blue Melody (BM) — Pure HTML/CSS/JS single-file app
     * Works offline. Designed for Android Chrome & WebView.
     * ===================================================== */

    const fileInput = document.getElementById('fileInput');
    const pickFilesBtn = document.getElementById('pickFilesBtn');
    const pickDirBtn = document.getElementById('pickDirBtn');

    const playlistEl = document.getElementById('playlist');
    const trackCountEl = document.getElementById('trackCount');

    const audio = document.getElementById('audio');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const skipBtn = document.getElementById('skipBtn');

    const repeatOneBtn = document.getElementById('repeatOneBtn');
    const repeatAllBtn = document.getElementById('repeatAllBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');

    const repeatModeLabel = document.getElementById('repeatModeLabel');
    const shuffleLabel = document.getElementById('shuffleLabel');

    const seek = document.getElementById('seek');
    const volume = document.getElementById('volume');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');

    const nowTitle = document.getElementById('nowTitle');

    // Theme controls
    const bgPicker = document.getElementById('bgPicker');
    const fgPicker = document.getElementById('fgPicker');
    const accentPicker = document.getElementById('accentPicker');
    const fontSize = document.getElementById('fontSize');
    const fontFamily = document.getElementById('fontFamily');
    const saveTheme = document.getElementById('saveTheme');
    const resetTheme = document.getElementById('resetTheme');

    // State
    const state = {
      playlist: /** @type {{name:string, url:string, file?:File}[]} */([]),
      index: -1,
      wasPlaying: false,
      shuffle: false,
      repeatOne: false,
      repeatAll: false,
    };

    // ===== Utilities =====
    const fmtTime = (sec) => {
      if (!isFinite(sec)) return '00:00';
      const s = Math.floor(sec % 60).toString().padStart(2,'0');
      const m = Math.floor(sec / 60).toString().padStart(2,'0');
      return `${m}:${s}`;
    };

    const persist = {
      saveTheme(){
        const theme = {
          bg: bgPicker.value,
          fg: fgPicker.value,
          accent: accentPicker.value,
          size: fontSize.value,
          family: fontFamily.value,
        };
        localStorage.setItem('bm.theme', JSON.stringify(theme));
        alert('Theme saved!');
      },
      loadTheme(){
        try {
          const t = JSON.parse(localStorage.getItem('bm.theme')||'null');
          if (!t) return;
          bgPicker.value = t.bg; fgPicker.value = t.fg; accentPicker.value = t.accent;
          fontSize.value = t.size; fontFamily.value = t.family;
          applyTheme();
        } catch {}
      },
      savePlaylist(){
        // Persist only names (for UI) — file access cannot be persisted for security.
        const names = state.playlist.map(t=>t.name);
        localStorage.setItem('bm.playlist.names', JSON.stringify(names));
      }
    };

    function applyTheme(){
      document.documentElement.style.setProperty('--bg', bgPicker.value);
      document.documentElement.style.setProperty('--fg', fgPicker.value);
      document.documentElement.style.setProperty('--accent', accentPicker.value);
      document.documentElement.style.setProperty('--text-size', fontSize.value + 'px');
      document.documentElement.style.setProperty('--font', fontFamily.value);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', bgPicker.value);
    }

    bgPicker.addEventListener('input', applyTheme);
    fgPicker.addEventListener('input', applyTheme);
    accentPicker.addEventListener('input', applyTheme);
    fontSize.addEventListener('input', applyTheme);
    fontFamily.addEventListener('change', applyTheme);
    saveTheme.addEventListener('click', persist.saveTheme);
    resetTheme.addEventListener('click', ()=>{ localStorage.removeItem('bm.theme'); location.reload(); });

    // ===== File / Folder selection =====
    pickFilesBtn.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', async (e)=>{
      const files = Array.from(fileInput.files||[]);
      await addFiles(files);
      fileInput.value = '';
    });

    pickDirBtn.addEventListener('click', async ()=>{
      if (!('showDirectoryPicker' in window)) {
        alert('Folder access needs a modern browser (Chrome 86+). Use "Add Music" instead.');
        return;
      }
      try {
        const handle = await window.showDirectoryPicker({ mode: 'read' });
        const files = [];
        for await (const entry of handle.values()){
          if (entry.kind === 'file'){
            const file = await entry.getFile();
            if (file.type.startsWith('audio/')) files.push(file);
          }
        }
        await addFiles(files);
      } catch (err) {
        if (err && err.name !== 'AbortError') console.warn(err);
      }
    });

    async function addFiles(files){
      for (const file of files){
        if (!file.type.startsWith('audio/')) continue;
        const url = URL.createObjectURL(file);
        state.playlist.push({ name: file.name.replace(/\.[^/.]+$/, ''), url, file });
      }
      if (state.index === -1 && state.playlist.length > 0) state.index = 0;
      renderPlaylist();
      updateTrackCount();
      persist.savePlaylist();
      if (state.wasPlaying || audio.paused === false) playCurrent();
    }

    function updateTrackCount(){
      trackCountEl.textContent = state.playlist.length.toString();
    }

    function renderPlaylist(){
      playlistEl.innerHTML = '';
      state.playlist.forEach((t, i)=>{
        const row = document.createElement('div');
        row.className = 'track' + (i === state.index ? ' active' : '');
        row.role = 'listitem';
        row.tabIndex = 0;
        row.innerHTML = `
          <div class="index">${i+1}</div>
          <div class="name" title="${t.name}">${t.name}</div>
          <div class="duration" id="dur-${i}">--:--</div>
        `;
        row.addEventListener('click', ()=>{
          const wasPlaying = !audio.paused;
          state.index = i; loadCurrent(); if (wasPlaying) playCurrent();
        });
        playlistEl.appendChild(row);
      });
      loadCurrentMetaDurations();
      refreshNowPlayingHeader();
    }

    function refreshNowPlayingHeader(){
      nowTitle.textContent = state.index >=0 ? state.playlist[state.index]?.name || 'Not Playing' : 'Not Playing';
    }

    function loadCurrent(){
      const track = state.playlist[state.index];
      if (!track) return;
      audio.src = track.url;
      refreshNowPlayingHeader();
      highlightActive();
    }

    function playCurrent(){
      const track = state.playlist[state.index];
      if (!track) return;
      audio.play().catch(err=>console.warn('Autoplay blocked:', err));
      setPlayUi(true);
    }

    function setPlayUi(isPlaying){
      playIcon.classList.toggle('hidden', isPlaying);
      pauseIcon.classList.toggle('hidden', !isPlaying);
    }

    function highlightActive(){
      [...playlistEl.children].forEach((el, idx)=>{
        el.classList.toggle('active', idx === state.index);
      });
    }

    // ===== Controls =====
    playPauseBtn.addEventListener('click', ()=>{
      if (audio.src === '' && state.playlist.length){ loadCurrent(); }
      if (audio.paused) { audio.play(); setPlayUi(true); }
      else { audio.pause(); setPlayUi(false); }
    });

    prevBtn.addEventListener('click', ()=>{
      const was = !audio.paused;
      if (state.playlist.length === 0) return;
      state.index = (state.index - 1 + state.playlist.length) % state.playlist.length;
      loadCurrent();
      if (was) playCurrent(); else setPlayUi(false);
    });

    nextBtn.addEventListener('click', ()=>{
      const was = !audio.paused;
      goNext();
      if (was) playCurrent(); else setPlayUi(false);
    });

    function goNext(){
      if (state.shuffle && state.playlist.length > 1){
        let n;
        do { n = Math.floor(Math.random()*state.playlist.length); } while (n === state.index);
        state.index = n;
      } else {
        state.index = (state.index + 1) % state.playlist.length;
      }
      loadCurrent();
    }

    skipBtn.addEventListener('click', ()=>{
      // Stops all music from playing
      audio.pause(); audio.currentTime = 0; setPlayUi(false);
    });

    repeatOneBtn.addEventListener('click', ()=>{
      state.repeatOne = !state.repeatOne;
      if (state.repeatOne) state.repeatAll = false; // mutually exclusive
      updateRepeatShuffleLabels();
    });

    repeatAllBtn.addEventListener('click', ()=>{
      state.repeatAll = !state.repeatAll;
      if (state.repeatAll) state.repeatOne = false;
      updateRepeatShuffleLabels();
    });

    shuffleBtn.addEventListener('click', ()=>{
      state.shuffle = !state.shuffle;
      updateRepeatShuffleLabels();
    });

    function updateRepeatShuffleLabels(){
      let rep = 'Off';
      if (state.repeatOne) rep = 'One';
      else if (state.repeatAll) rep = 'All';
      repeatModeLabel.textContent = `Repeat: ${rep}`;
      shuffleLabel.textContent = `Shuffle: ${state.shuffle ? 'On' : 'Off'}`;
    }

    // ===== Progress / Seek / Volume =====
    audio.addEventListener('timeupdate', ()=>{
      const p = (audio.currentTime / (audio.duration||1));
      seek.value = String(Math.floor(p * 1000));
      currentTimeEl.textContent = fmtTime(audio.currentTime);
      totalTimeEl.textContent = fmtTime(audio.duration);
    });

    seek.addEventListener('input', ()=>{
      const p = Number(seek.value)/1000;
      audio.currentTime = p * (audio.duration||0);
    });

    volume.addEventListener('input', ()=>{ audio.volume = Number(volume.value); });

    audio.addEventListener('play', ()=> setPlayUi(true));
    audio.addEventListener('pause', ()=> setPlayUi(false));

    audio.addEventListener('ended', ()=>{
      if (state.repeatOne) { audio.currentTime = 0; audio.play(); return; }
      const atEnd = state.index === state.playlist.length - 1;
      if (state.shuffle) {
        goNext(); audio.play(); return;
      }
      if (atEnd && !state.repeatAll){ setPlayUi(false); return; }
      goNext(); audio.play();
    });

    // Preload and show durations in list
    function loadCurrentMetaDurations(){
      state.playlist.forEach((t, i)=>{
        const a = new Audio();
        a.src = t.url; a.preload = 'metadata';
        a.addEventListener('loadedmetadata', ()=>{
          const d = document.getElementById('dur-' + i);
          if (d) d.textContent = fmtTime(a.duration);
        }, { once:true });
      });
    }

    // Keyboard shortcuts
    window.addEventListener('keydown', (e)=>{
      if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
      if (e.code === 'Space'){ e.preventDefault(); playPauseBtn.click(); }
      if (e.code === 'ArrowRight'){ nextBtn.click(); }
      if (e.code === 'ArrowLeft'){ prevBtn.click(); }
      if (e.key.toLowerCase() === 's'){ shuffleBtn.click(); }
      if (e.key.toLowerCase() === 'r'){ repeatOneBtn.click(); }
    });

    // Initialize
    applyTheme();
    persist.loadTheme();
    updateRepeatShuffleLabels();

    // Optional: Register a tiny service worker (in-memory) for PWA install
    if ('serviceWorker' in navigator) {
      const swCode = `self.addEventListener('install', e=>{self.skipWaiting();}); self.addEventListener('activate', e=>{clients.claim();});`;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url).catch(()=>{});
    }
  </script>
</body>
</html>
