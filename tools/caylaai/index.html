<script>
function toggleMenu(){
let sidebar=document.getElementById("sidebar");
sidebar.style.left = sidebar.style.left === "0px" ? "-260px" : "0px";
}

function openInternal(url){
if(url.match(/\.(zip|exe|apk|rar|pdf|docx|xlsx)$/i)){
window.open(url);
return;
}
document.getElementById("viewer").style.display="block";
document.getElementById("iframeViewer").src=url;
}









// HEADER HIDE/SHOW
const header = document.getElementById('header');
document.body.addEventListener('mousemove', e => {
  if(e.clientY < 70){ header.classList.remove('hidden'); }
  else{ header.classList.add('hidden'); }
});

// ONLINE / OFFLINE CHECK
const statusEl = document.getElementById('status');
const onlineFrame = document.getElementById('online-frame');
const offlineContainer = document.getElementById('offline-container');

function updateStatus(online){
  if(online){
    statusEl.textContent = 'Cayla AI Online';
    statusEl.classList.remove('offline');
    onlineFrame.style.display='block';
    offlineContainer.style.display='none';
  } else {
    statusEl.textContent = 'Cayla AI Offline';
    statusEl.classList.add('offline');
    onlineFrame.style.display='none';
    offlineContainer.style.display='flex';
  }
}

// INITIAL CHECK
updateStatus(navigator.onLine);

// WATCH ONLINE/OFFLINE
window.addEventListener('online', () => updateStatus(true));
window.addEventListener('offline', () => updateStatus(false));

// SIMPLE OFFLINE AI
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('user-input');
document.getElementById('send-btn').addEventListener('click', sendMessage);
inputEl.addEventListener('keypress', e => { if(e.key==='Enter') sendMessage(); });

function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  addMessage(text,'user'); inputEl.value='';
  setTimeout(()=> addMessage(generateReply(text),'ai'), 600);
}

function addMessage(text, type){
  const div = document.createElement('div');
  div.className = `message ${type}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function generateReply(text){
  // Simple offline AI reply
  const replies = [
    "I see!🙄🙄🙄👀", "Interesting...😐", "Can you tell me more? 🤔", "Hmm...", "Let's think about it together.👩‍💻", "Connect Me To The Internet, Then Wait Till I Ask You Something. Okay? 😉🥲🤗", "Do You Wanna Learn or not? Please Turn On Your Internet 🥱🙄😶‍🌫️😶🤨, I Need Internet", "Connect Me To The Internet, Let's Chat, or Maybe Talk..🤷‍♀️?", "I Think You're Offline 😟😒😨😧", "Connect Me To The Internet", "See!! You're Definitely Offline 🤦‍♀️", "Please Connect To The Internet", "Can You Please Wait? Turn On Your Internet 😭😭😭", "Be Connected To The Internet", "Please, Be Internet Connected", "I Can Work When You're Connected To The Internet👩‍⚖️", "You're Offline 😟😔😖", "I Can Work When You're Internet Connected👩‍🔬", "I Need Your Internet Connectivity🤪", "I Need Your Internet Connectivity 😥😥😥 Please", "I Need Internet Connectivity🙍‍♀️"
  ];
  return replies[Math.floor(Math.random()*replies.length)];
}
