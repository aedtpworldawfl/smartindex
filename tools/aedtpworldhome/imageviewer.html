


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AEDTP WORLD HOME Image Viewer App</title>

<meta name="description" content="AEDTP WORLD HOME Image Viewer App: View Beautiful And Wonderful Pictures, Images And Captures Free. A Multihomed Full Of Apps, Productivity, Business, Educational by AEDTP WORLD">

<!-- Icons -->
<link rel="icon" type="image/png" href="https://aedtpworld.com/icons/aedtpworld.png">
<link rel="apple-touch-icon" href="https://aedtpworld.com/icons/aedtpworld.png">

<style>
/* AEDTP WORLD + BASE */
body {
  margin: 0;
  font-family: Arial;
  background: #fdf6ee;
  color: #000;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.dark {
  background: #121212;
  color: #fff;
}

/* HEADER */
header {
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  font-weight: bold;
}

.home-btn {
  position: absolute;
  left: 15px;
  cursor: pointer;
}

/* MAIN GRID */
main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr;
}

/* RESPONSIVE */
@media(min-width: 768px){
  main { grid-template-columns: repeat(3, 1fr); }
}
@media(max-width: 767px){
  main { grid-template-columns: repeat(2, 1fr); }
}

/* PANELS */
.panel {
  padding: 10px;
  box-sizing: border-box;
  overflow: hidden;
}

/* VIEWER */
.viewer {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 80%;
  overflow: hidden;
}

.viewer img {
  max-width: 100%;
  max-height: 100%;
  transition: transform 0.3s;
}

/* CONTROLS */
.controls {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

button {
  flex: 1;
  padding: 8px;
  cursor: pointer;
}

/* LIST */
.list {
  height: 80%;
  overflow-y: auto;
  border: 1px solid #ccc;
}

.list div {
  padding: 6px;
  cursor: pointer;
}

.list div:hover {
  background: #ddd;
}

.dark .list div:hover {
  background: #333;
}

/* FOOTER */
footer {
  height: 40px;
  text-align: center;
  line-height: 40px;
  opacity: 0.5;
  pointer-events: none;
}

/* TOGGLE */
.toggle {
  position: fixed;
  bottom: 50px;
  right: 10px;
  padding: 8px;
  background: #000;
  color: #fff;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <div class="home-btn" onclick="goHome()"></div>
  IMAGE VIEWER
</header>

<main>

<!-- PANEL 1: SELECT -->
<div class="panel">
  <h3>Select Images</h3>
  <input type="file" id="files" multiple accept="image/*">
  <input type="file" id="folder" webkitdirectory multiple accept="image/*">
  <p>Total Images: <span id="count">0</span></p>
</div>

<!-- PANEL 2: VIEWER -->
<div class="panel">
  <div class="viewer">
    <img id="image">
  </div>

  <div class="controls">
    <button onclick="prev()">⏮</button>
    <button onclick="next()">⏭</button>
  </div>

  <div class="controls">
    <button onclick="zoomIn()">Zoom +</button>
    <button onclick="zoomOut()">Zoom -</button>
    <button onclick="resetZoom()">Reset</button>
  </div>
</div>

<!-- PANEL 3: LIST -->
<div class="panel">
  <h3>Image List</h3>
  <div class="list" id="list"></div>
</div>

</main>

<div class="toggle" onclick="toggleMode()">Light/Dark</div>

<footer></footer>

<script>
let images = [];
let index = 0;
let scale = 1;

const img = document.getElementById("image");
const list = document.getElementById("list");
const count = document.getElementById("count");

/* LOAD */
function loadFiles(files){
  images = [...images, ...files];
  render();
}

document.getElementById("files").onchange = e => loadFiles(e.target.files);
document.getElementById("folder").onchange = e => loadFiles(e.target.files);

/* RENDER */
function render(){
  list.innerHTML = "";
  images.forEach((file, i)=>{
    const div = document.createElement("div");
    div.textContent = file.name;
    div.onclick = ()=>{
      index = i;
      show();
    };
    list.appendChild(div);
  });
  count.textContent = images.length;
  show();
}

/* SHOW IMAGE */
function show(){
  if(images.length === 0) return;
  img.src = URL.createObjectURL(images[index]);
  resetZoom();
}

/* NAV */
function next(){
  index = (index + 1) % images.length;
  show();
}

function prev(){
  index = (index - 1 + images.length) % images.length;
  show();
}

/* ZOOM */
function zoomIn(){
  scale += 0.2;
  img.style.transform = "scale(" + scale + ")";
}

function zoomOut(){
  scale -= 0.2;
  img.style.transform = "scale(" + scale + ")";
}

function resetZoom(){
  scale = 1;
  img.style.transform = "scale(1)";
}

/* NAVIGATION */
function goHome(){
  window.location.href = "index.html";
}

/* THEME */
function toggleMode(){
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
