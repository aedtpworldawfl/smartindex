<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEDTP WORLD HOME WIKI App</title>

<meta name="description" content="AEDTP WORLD FREE LICENSE (AWFL) WIKI: A free, open, continuously expanding knowledge universe. Built for the world. Powered by contribution. Licensed for freedom. What is AEDTP WORLD FREE LICENSE (AWFL) WIKI? AEDTP WORLD FREE LICENSE (AWFL) WIKI is a community-driven encyclopedia inspired by Wikipedia, but structured for continuous publishing, updating, and expansion. Articles grow over time, images can evolve, and knowledge never stops. Explore Knowledge Categories Browse structured knowledge across multiple domains. Each category contains expandable articles that can be updated repeatedly under the same subject link. A Multihomed Full Of Apps, Productivity, Business, Educational by AEDTP WORLD">



<link rel="icon" type="image/png" href="https://aedtpworld.com/icons/aedtpworld.png">
<link rel="apple-touch-icon" href="https://aedtpworld.com/icons/aedtpworld.png">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    transition: 0.3s;
}

body.light {
    background: #f4f4f4;
    color: #111;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    background: rgba(0,0,0,0.7);
}

body.light header {
    background: rgba(255,255,255,0.8);
}

button {
    padding: 8px;
    cursor: pointer;
}

.container {
    padding: 10px;
}

iframe {
    width: 100%;
    height: calc(100vh - 80px);
    border: none;
    background: #fff;
}
</style>
</head>

<body>

<header>
    <div>WIKI App</div>
    <div>
        <button onclick="toggleMode()">Toggle Mode</button>
        <button onclick="reloadWiki()">Reload</button>
        <button onclick="toggleFullscreen()">Fullscreen</button>

    </div>
</header>

<div class="container">
    <iframe 
        id="wikiFrame"
        src="https://aedtpworld.com/awflwiki/">
    </iframe>
</div>

<script>
/* Toggle light/dark mode */
function toggleMode() {
    document.body.classList.toggle("light");
}

/* Reload wiki */
function reloadWiki() {
    document.getElementById("wikiFrame").src =
        "https://aedtpworld.com/awflwiki/";
}

function toggleFullscreen() {
    const iframe = document.getElementById("wikiFrame");
    if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
    }
}
</script>

</body>
</html>
