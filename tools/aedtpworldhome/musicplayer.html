





<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AEDTP WORLD HOME Music Player App</title>

<meta name="description" content="AEDTP WORLD HOME Music Player App: Play Audio Sounds, Listen And Enjoy Smooth Sounds, Play Music Free. A Multihomed Full Of Apps, Productivity, Business, Educational by AEDTP WORLD">

<!-- Icons -->
<link rel="icon" type="image/png" href="https://aedtpworld.com/icons/aedtpworld.png">
<link rel="apple-touch-icon" href="https://aedtpworld.com/icons/aedtpworld.png">

<style>
/* AEDTP WORLD + BASE */
body {
  margin: 0;
  font-family: Arial;
  background: #fdf6ee;
  color: #000;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.dark {
  background: #121212;
  color: #fff;
}

/* HEADER */
header {
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  font-weight: bold;
}

.home-btn {
  position: absolute;
  left: 15px;
  cursor: pointer;
}

/* MAIN */
main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr;
  overflow: hidden;
}

/* RESPONSIVE GRID */
@media(min-width: 768px){
  main {
    grid-template-columns: repeat(3, 1fr);
  }
}
@media(max-width: 767px){
  main {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* PANELS */
.panel {
  padding: 10px;
  box-sizing: border-box;
  overflow: hidden;
}

/* FILE SELECT */
input {
  width: 100%;
}

/* PLAYLIST */
.playlist {
  height: 80%;
  overflow-y: auto;
  border: 1px solid #ccc;
  padding: 5px;
}

.playlist div {
  padding: 5px;
  cursor: pointer;
}

.playlist div:hover {
  background: #ddd;
}

.dark .playlist div:hover {
  background: #333;
}

/* CONTROLS */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

button {
  flex: 1;
  padding: 10px;
  cursor: pointer;
}

/* FOOTER */
footer {
  height: 40px;
  text-align: center;
  line-height: 40px;
  opacity: 0.5;
  pointer-events: none; /* inactive effect */
}

/* TOGGLE */
.toggle {
  position: fixed;
  bottom: 50px;
  right: 10px;
  padding: 8px;
  background: #000;
  color: #fff;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <div class="home-btn" onclick="goHome()"></div>
  MUSIC PLAYER
</header>

<main>

<!-- PANEL 1: FILE SELECT -->
<div class="panel">
  <h3>Select Audio</h3>
  <input type="file" id="fileInput" multiple accept="audio/*">
  <input type="file" id="folderInput" webkitdirectory multiple accept="audio/*">
  <p>Total Files: <span id="count">0</span></p>
</div>

<!-- PANEL 2: PLAYLIST -->
<div class="panel">
  <h3>Playlist</h3>
  <div class="playlist" id="playlist"></div>
</div>

<!-- PANEL 3: CONTROLS -->
<div class="panel">
  <h3>Controls</h3>

  <audio id="audio"></audio>

  <div class="controls">
    <button onclick="prev()">⏮</button>
    <button onclick="play()">▶</button>
    <button onclick="pause()">⏸</button>
    <button onclick="next()">⏭</button>
  </div>

  <div class="controls">
    <button onclick="toggleLoop()">Loop</button>
    <button onclick="shuffle()">Shuffle</button>
  </div>

</div>

</main>

<div class="toggle" onclick="toggleMode()">Light/Dark</div>

<footer></footer>

<script>
let files = [];
let index = 0;
let loop = false;

const audio = document.getElementById("audio");
const playlist = document.getElementById("playlist");
const count = document.getElementById("count");

/* LOAD FILES */
function loadFiles(fileList){
  files = [...files, ...fileList];
  render();
}

document.getElementById("fileInput").onchange = e => loadFiles(e.target.files);
document.getElementById("folderInput").onchange = e => loadFiles(e.target.files);

/* RENDER PLAYLIST */
function render(){
  playlist.innerHTML = "";
  files.forEach((file, i)=>{
    const div = document.createElement("div");
    div.textContent = file.name;
    div.onclick = () => {
      index = i;
      play();
    };
    playlist.appendChild(div);
  });
  count.textContent = files.length;
}

/* PLAYER */
function play(){
  if(files.length === 0) return;
  audio.src = URL.createObjectURL(files[index]);
  audio.play();
}

function pause(){
  audio.pause();
}

function next(){
  index = (index + 1) % files.length;
  play();
}

function prev(){
  index = (index - 1 + files.length) % files.length;
  play();
}

function toggleLoop(){
  loop = !loop;
}

function shuffle(){
  files.sort(()=>Math.random()-0.5);
  render();
}

/* AUTO NEXT */
audio.onended = ()=>{
  if(loop){
    play();
  } else {
    next();
  }
};

/* HOME NAVIGATION */
function goHome(){
  window.location.href = "index.html";
}

/* THEME */
function toggleMode(){
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
