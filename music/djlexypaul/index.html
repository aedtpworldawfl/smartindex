<script>
const TARGET_USERNAME = "djlexypaul";
function bmSession(){ try{ return JSON.parse(localStorage.getItem('bm_session')); }catch(e){ return null; } }
(function initFollowBtn(){
  const s = bmSession();
  const btn = document.getElementById('followBtn');
  if (!s) { btn.textContent = 'Log in to Follow'; return; }
  if (s.username.toLowerCase() === TARGET_USERNAME.toLowerCase()) { btn.style.display = 'none'; return; }
  fetch('https://aedtpworld.com/music/api.php?action=isFollowing&follower=' + encodeURIComponent(s.username) + '&target=' + encodeURIComponent(TARGET_USERNAME))
    .then(r => r.json()).then(d => { if (d.following) btn.classList.add('following'), btn.textContent = 'Following'; });
})();
async function bmToggleFollow(){
  const s = bmSession();
  if (!s) { window.location.href = 'https://aedtpworld.com/music/?auth=login'; return; }
  const btn = document.getElementById('followBtn');
  const res = await fetch('https://aedtpworld.com/music/api.php?action=follow', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ follower: s.username, target: TARGET_USERNAME })
  });
  const d = await res.json();
  if (d.success) {
    btn.classList.toggle('following', d.following);
    btn.textContent = d.following ? 'Following' : 'Follow';
    document.getElementById('followerCount').textContent = d.followerCount;
  }
}
function bmShareProfile(){
  const url = window.location.href;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => alert('🔗 Link copied!')).catch(() => prompt('Copy this link:', url));
  } else {
    prompt('Copy this link:', url);
  }
}
</script>
