<script>
function bmSession(){ try{ return JSON.parse(localStorage.getItem('bm_session')); }catch(e){ return null; } }
function bmShareTrack(slug){
  const url = "https://aedtpworld.com/music/klemz/music/" + slug + ".html";
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => alert('🔗 Link copied!')).catch(() => prompt('Copy this link:', url));
  } else {
    prompt('Copy this link:', url);
  }
}
(function(){
  const s = bmSession();
  if (s && s.username.toLowerCase() === "klemz".toLowerCase()) {
    document.querySelectorAll('.del').forEach(b => b.style.display = 'inline-block');
  }
})();
async function bmDeleteTrack(id){
  const s = bmSession();
  if (!s) return;
  if (!confirm('Delete this release? This cannot be undone.')) return;
  const res = await fetch('https://aedtpworld.com/music/api.php?action=delete', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ username: s.username, id })
  });
  const d = await res.json();
  if (d.success) location.reload(); else alert(d.error || 'Delete failed');
}
</script>
