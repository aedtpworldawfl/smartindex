<style>*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--wikiText);margin:0;background:#f6f6f6;line-height:1.5;overflow-wrap:anywhere}

main{margin:16px auto;background:#fff;padding:16px;border:1px solid #ddd}
h1{margin-top:0;font-size:1.6rem;line-height:1.25}
.meta{color:#666;margin:-6px 0 10px;font-size:14px}

.result{display:flex;gap:12px;align-items:center;padding:8px 12px;text-decoration:none;color:inherit;border-bottom:1px solid #eee}

.no-results{padding:12px;color:#777}
.search-thumb{width:60px;height:60px;aspect-ratio:1/1;object-fit:cover;border-radius:8px;flex:none}

td,th{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top}
th{background:#f3f3f3}
td.prop{width:32%;background:#fafafa;font-weight:600}
.pill{display:inline-block;background:#e8f0fe;padding:4px 10px;border-radius:20px;margin:2px;text-decoration:none}

.ext{vertical-align:-1px;margin-left:3px}
.btn,button{display:inline-block;background:var(--button);color:var(--buttonText);border:0;padding:9px 14px;border-radius:6px;cursor:pointer;text-decoration:none;font-size:14px;font-family:inherit}

.combo{position:relative}

.combo .dd div{padding:9px 12px;cursor:pointer}

.combo .dd .none{color:#777;cursor:default}
.combo input.bad{border-color:#b32424;background:#fff5f5}
.err{background:#fde8e8;color:#8a1f1f;padding:10px;border-radius:6px;margin-bottom:12px}
.ok{background:#e6f6e6;color:#1d6b1d;padding:10px;border-radius:6px;margin-bottom:12px}
.warn{background:#fff3cd;color:#664d03;padding:10px;border-radius:6px;margin-bottom:12px}
.muted{color:#777;font-size:14px;font-weight:400}

.up{color:#1a7f37;font-weight:700}.down{color:#b32424;font-weight:700}.zero{color:#777}
.red{color:#b32424;font-weight:700}
.switch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.state{font-weight:700}.state.on{color:#1a7f37}.state.off{color:#b32424}
.inline{display:inline}
footer{text-align:center;padding:20px 16px;color:#666;font-size:14px}
@media(min-width:768px){

.wst .pill{padding:2px 9px;margin:1px 2px 1px 0}
@media(min-width:768px){
