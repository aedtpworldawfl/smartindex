<style>
    :root {
        --accent-1: #0086C2;
        --accent-2: #4285F4;
        --accent-3: #34A853;
        --ink: #202124;
        --muted: #5f6368;
        --line: #dfe1e5;
        --surface: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        color: var(--ink);
        min-height: 100vh;
        background:
            radial-gradient(1200px 600px at 15% -10%, rgba(66,133,244,0.10), transparent 60%),
            radial-gradient(1000px 500px at 110% 10%, rgba(0,134,194,0.10), transparent 55%),
            #ffffff;
        overflow-x: hidden;
    }
    a { text-decoration: none; }

    /* ---------- Home nav (top-right corner) ---------- */
    .home-nav {
        position: absolute;
        top: 20px;
        right: 24px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
        z-index: 5;
    }
    .home-nav a {
        font-size: 13px;
        color: #3c4043;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 7px 14px;
        white-space: nowrap;
        background: rgba(255,255,255,0.7);
        backdrop-filter: blur(6px);
        transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .home-nav a:hover {
        border-color: #c8cbd0;
        box-shadow: 0 2px 10px rgba(32,33,36,0.12);
        transform: translateY(-1px);
    }

    /* ---------- Center wrap (home mode) ---------- */
    .home-wrap {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 90px 20px 40px;
        text-align: center;
        gap: clamp(18px, 3vw, 32px);
    }

    /* ---------- Logo: centered, width = 1/3 of viewport on all devices ---------- */
    .logo-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
    }
    .logo-wrap img {
        width: 33.333vw;
        min-width: 96px;
        max-width: 340px;
        height: auto;
        display: block;
        filter: drop-shadow(0 6px 18px rgba(0,134,194,0.18));
        animation: floatLogo 5s ease-in-out infinite;
    }
    @keyframes floatLogo {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }

    /* ---------- Search form: centered, input width = 2:4 (i.e. 50vw) on all devices ---------- */
    .search-form {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }
    .search-box {
        display: flex;
        align-items: center;
        width: 50vw;
        min-width: 220px;
        max-width: 680px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 12px 20px;
        background: var(--surface);
        box-shadow: 0 2px 5px rgba(32,33,36,0.06);
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .search-box:hover, .search-box:focus-within {
        box-shadow: 0 4px 18px rgba(66,133,244,0.20);
        border-color: rgba(223,225,229,0);
    }
    .search-box svg { width: 20px; height: 20px; fill: var(--accent-2); flex-shrink: 0; }
    .search-box input[type="text"] {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        font-size: 16px;
        background: transparent;
        color: var(--ink);
        padding: 0 10px;
    }
    .search-box button.icon-submit {
        border: none;
        background: linear-gradient(135deg, var(--accent-2), var(--accent-1));
        color: #fff;
        border-radius: 999px;
        cursor: pointer;
        padding: 8px 18px;
        font-size: 14px;
        font-weight: 600;
        transition: filter 0.2s ease, transform 0.15s ease;
    }
    .search-box button.icon-submit:hover { filter: brightness(1.08); transform: translateY(-1px); }

    /* ---------- AI action buttons: centered, aspect-ratio 3:1 (height:width = 1:3) ---------- */
    .ai-buttons {
        width: 50vw;
        min-width: 220px;
        max-width: 680px;
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
    }
    .ai-btn {
        flex: 1 1 calc(50% - 16px);
        min-width: 160px;
        aspect-ratio: 3 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 16px;
        font-size: clamp(13px, 1.4vw, 15px);
        font-weight: 600;
        color: #fff;
        border: none;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        box-shadow: 0 4px 14px rgba(0,0,0,0.10);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .ai-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        transition: opacity 0.25s ease;
    }
    .ai-btn.cayla::before { background: linear-gradient(135deg, #6a11cb, #2575fc); }
    .ai-btn.aedtp::before { background: linear-gradient(135deg, #0086C2, #34A853); }
    .ai-btn::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0));
        transition: opacity 0.25s ease;
    }
    .ai-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.18); }
    .ai-btn:hover::after { opacity: 1; }
    .ai-btn svg { width: 18px; height: 18px; fill: #fff; flex-shrink: 0; }

    .footer-note {
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
    }

    /* ---------- Tablet ---------- */
    @media (max-width: 820px) {
        .home-wrap { padding: 76px 18px 30px; }
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 600px) {
        .home-nav { position: static; margin-bottom: 18px; justify-content: center; width: 100%; }
        .home-nav a { font-size: 12px; padding: 6px 10px; }
        .home-wrap { padding: 20px 14px 30px; gap: 20px; }
        .search-box { padding: 10px 16px; }
        .search-box button.icon-submit { padding: 8px 14px; font-size: 13px; }
        .ai-btn { flex: 1 1 100%; }
    }

    @media (max-width: 360px) {
        .home-nav a { flex: 1; text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
        .logo-wrap img { animation: none; }
    }
</style>
