        /* =====================================================================
           AD PAGE CONTENT SUPPORT
           -----------------------------------------------------------------------
           Every /advertise/ads/*.html page is fetched, its <body> markup is
           extracted, and dropped into an .awflmeta-content wrapper (see the
           loader script below). Because content injected via innerHTML never
           executes <script> tags or picks up the ad page's own <head><style>,
           an ad.html page must NOT rely on inline <style>/<script> for its
           effects — instead it marks itself up with the classes and
           data-attributes below, and this parent page supplies the CSS/JS
           that brings those markers to life. Expected ad.html contract:

             <div class="ad-page"
                  data-ad-id="username_1699999999"
                  data-enhanced-visibility="true|false"
                  data-magic-effect="true|false"
                  data-magic-text="true|false"
                  data-magic-texts='["🔥 Hot deal","🎉 Sale"]'>
               <div class="ad-header">
                 <h1 class="ad-title">Ad title</h1>
                 <p class="ad-description">Desc with <b>bold</b>/<i>italic</i></p>
               </div>
               <div class="ad-image-wrap">
                 <img class="ad-image" src="..." alt="...">
               </div>
               <div class="ad-buttons">
                 <a class="ad-btn" href="...">Label</a>
               </div>
             </div>
           ===================================================================== */

        .ad-page {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            padding: 1.4rem;
            isolation: isolate;
        }

        /* ---- enhanced_visibility: animated gradient border + bg pattern ---- */
        .ad-page[data-enhanced-visibility="true"] {
            background:
                linear-gradient(#12151b, #12151b) padding-box,
                linear-gradient(120deg, #D10303, #FFDE2C, #D10303) border-box;
            border: 2px solid transparent;
            background-size: 100% 100%, 300% 300%;
            animation: ad-border-flow 6s ease infinite;
        }
        .ad-page[data-enhanced-visibility="true"]::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            opacity: 0.10;
            background-image:
                radial-gradient(circle at 20% 20%, #FFDE2C 0, transparent 40%),
                radial-gradient(circle at 80% 60%, #D10303 0, transparent 45%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 14px);
            pointer-events: none;
        }
        @keyframes ad-border-flow {
            0%, 100% { background-position: 0 0, 0% 50%; }
            50%      { background-position: 0 0, 100% 50%; }
        }

        (function() {

            /**

            async function loadawflmetaPages() {
                try {
                    // 1. Fetch index.json
                    const indexRes = await fetch('/advertise/awflmeta.json');
                    if (!indexRes.ok) throw new Error(`index.json fetch failed: ${indexRes.status}`);
                    const pages = await indexRes.json();

                    // Hide loader
                    status.style.display = 'none';

                    if (!pages || !pages.length) {
                        container.innerHTML =
                            `<p style="padding:40px 0; color:#7a879e; font-family:monospace; text-align:center;">No AEDTP WORLD ADS pages found.</p>`;
                        return;
                    }

                    // 2. Loop through each awflmeta entry
                    for (let i = 0; i < pages.length; i++) {
                        const item = pages[i];
                        try {
                            const htmlRes = await fetch(`/advertise/ads/${item.file}`);
                            if (!htmlRes.ok) throw new Error(`${item.file} fetch failed: ${htmlRes.status}`);
                            const rawHtml = await htmlRes.text();

                            // 3. Parse and extract body content only
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(rawHtml, 'text/html');
                            const bodyContent = doc.body ? doc.body.innerHTML : rawHtml;

                            // 4. Inject card
                            const card = document.createElement('div');
                            card.className = 'awflmeta-card';
                            card.innerHTML = `
                                <div class="card-header">
                                    <h2>${escapeHtml(item.name)}</h2>
                                    <span class="card-tag">AWFLMETA</span>
                                </div>
                                <div class="awflmeta-content">
                                    ${bodyContent}
                                </div>
                            `;
                            container.appendChild(card);

                            // 4b. Bring the injected ad-page markup to life —
                            // innerHTML never runs <script> tags, so effects
                            // (particles/magic text/image fallback) are wired
                            // up manually here instead.
                            enhanceAdCard(card);

                        } catch (err) {
                            console.warn(`Could not load /advertise/ads/${item.file}:`, err);
                            const errCard = document.createElement('div');
                            errCard.className = 'awflmeta-card';
                            errCard.innerHTML = `
                                <div class="card-header">
                                    <h2>${escapeHtml(item.name)}</h2>
                                    <span class="card-tag error">ERROR</span>
                                </div>
                                <div class="awflmeta-content" style="color:#7a879e;font-family:monospace;font-size:0.9rem;padding:1.2rem 0;">
                                    ⚠ Could not load AEDTP WORLD ADS for <strong style="color:#a8b3c9;">${escapeHtml(item.name)}</strong>.
                                    <br /><span style="font-size:0.8rem;color:#5a677e;">${escapeHtml(err.message || 'unknown error')}</span>
                                </div>
                            `;
                            container.appendChild(errCard);
                        }

                        // 5. Add divider after every fetch (except the last one)
                        if (i < pages.length - 1) {
                            container.appendChild(createDivider());
                        }
                    }

                } catch (err) {
                    status.innerHTML =
                        `<span style="color:#ff6b4a; display:flex; align-items:center; gap:0.5rem;">⚠ Failed to load AEDTP WORLD ADS index: ${escapeHtml(err.message)}</span>`;
                    console.error(err);
                }
            }

            /**
             * Deterministic small hash — same ad id always maps to the same
             * fallback pattern, instead of a new random color every reload.
             */
            function hashSeed(str) {
                let h = 0;
                for (let i = 0; i < str.length; i++) {
                    h = (h << 5) - h + str.charCodeAt(i);
                    h |= 0;
                }
                return Math.abs(h);
            }

            /**
             * For every .ad-image inside scopeEl: if it fails to load, hide
             * it and reveal the matching .ad-pattern-fallback block instead
             * (colored gradient seeded from data-ad-id, 8 palettes total).
             */
            function wireImageFallback(scopeEl) {
                const wraps = scopeEl.querySelectorAll('.ad-image-wrap');
                wraps.forEach(wrap => {
                    const img = wrap.querySelector('.ad-image');
                    if (!img) return;
                    const page = scopeEl.querySelector('.ad-page');
                    const seed = (page && page.dataset.adId) || img.src || 'ad';
                    const patternIndex = hashSeed(seed) % 8;

                    const showFallback = () => {
                        img.classList.add('is-broken');
                        let fallback = wrap.querySelector('.ad-pattern-fallback');
                        if (!fallback) {
                            fallback = document.createElement('div');
                            fallback.className = `ad-pattern-fallback ad-pattern-${patternIndex}`;
                            fallback.textContent = '📢';
                            wrap.appendChild(fallback);
                        }
                        fallback.classList.add('is-active');
                    };

                    if (!img.getAttribute('src')) {
                        showFallback();
                        return;
                    }
                    if (img.complete && img.naturalWidth === 0) {
                        showFallback();
                    }
                    img.addEventListener('error', showFallback, { once: true });
                });
            }

            /**
             * magic_effect: spawns small floating particles that drift
             * upward inside the ad-page, on a dedicated absolutely
             * positioned layer so they never affect card layout/height.
             */
            function wireParticles(pageEl) {
                if (pageEl.dataset.magicEffect !== 'true') return;
                const layer = document.createElement('div');
                layer.className = 'ad-particles-layer';
                const COUNT = 16;
                for (let i = 0; i < COUNT; i++) {
                    const p = document.createElement('span');
                    p.className = 'ad-particle';
                    p.style.left = `${Math.random() * 100}%`;
                    p.style.setProperty('--drift', `${(Math.random() * 60 - 30).toFixed(0)}px`);
                    p.style.animationDuration = `${(4 + Math.random() * 4).toFixed(2)}s`;
                    p.style.animationDelay = `${(Math.random() * 5).toFixed(2)}s`;
                    p.style.opacity = (0.3 + Math.random() * 0.5).toFixed(2);
                    layer.appendChild(p);
                }
                pageEl.appendChild(layer);
            }

            /**
             * magic_text: reads data-magic-texts (JSON array, hard-capped at
             * 20 items / 20 chars each to match the create.php limits) and
             * creates one floating text div per entry, each drifting in a
             * random direction so they never lag or overlap identically.
             */
            function wireMagicText(pageEl) {
                if (pageEl.dataset.magicText !== 'true') return;
                let texts = [];
                try {
                    texts = JSON.parse(pageEl.dataset.magicTexts || '[]');
                } catch (e) {
                    return;
                }
                if (!Array.isArray(texts) || !texts.length) return;
                texts = texts.slice(0, 20);

                const layer = document.createElement('div');
                layer.className = 'ad-magic-text-layer';
                texts.forEach((raw, i) => {
                    const text = String(raw).slice(0, 20);
                    const el = document.createElement('span');
                    el.className = 'ad-magic-text-item';
                    el.textContent = text; // textContent, not innerHTML — emoji-safe, XSS-safe
                    el.style.left = `${Math.random() * 80}%`;
                    el.style.top = `${Math.random() * 80}%`;
                    el.style.setProperty('--dx', `${(Math.random() * 80 - 40).toFixed(0)}px`);
                    el.style.setProperty('--dy', `${(-40 - Math.random() * 60).toFixed(0)}px`);
                    el.style.animationDuration = `${(5 + Math.random() * 4).toFixed(2)}s`;
                    el.style.animationDelay = `${(i * 0.15 + Math.random()).toFixed(2)}s`;
                    layer.appendChild(el);
                });
                pageEl.appendChild(layer);
            }

            /**
             * Entry point called once per injected ad card. Safe to call on
             * cards that aren't an ad.html page at all (e.g. wiki content) —
             * it simply finds nothing to enhance and does nothing.
             */
            function enhanceAdCard(cardEl) {
                wireImageFallback(cardEl);
                const pageEl = cardEl.querySelector('.ad-page');
                if (!pageEl) return;
                wireParticles(pageEl);
                wireMagicText(pageEl);
            }

            /**
             * Simple escape to prevent XSS from page names
             */
            function escapeHtml(str) {
                if (!str) return '';
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return String(str).replace(/[&<>"']/g, function(m) { return map[m]; });
            }

            // kick off
            loadawflmetaPages();

        })();
    </script>
