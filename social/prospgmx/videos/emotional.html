<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emotional — @prospgmx — BIZIMI</title>
<style>
:root{--red:#D10303;--yellow:#FFDE2C;--ink:#181818;--bg:#faf9f6;--muted:#6b6b6b;}
*{box-sizing:border-box;}
body{margin:0;font-family:sans-serif;background:var(--bg);color:var(--ink);}
header{background:var(--red);color:#fff;padding:12px 20px;}
header a{color:#fff;text-decoration:none;font-weight:800;}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
.frame{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;}
.frame iframe,.frame video{width:100%;height:100%;border:0;}
h1{font-size:1.3rem;margin:16px 0 4px;}
.by{color:var(--muted);font-size:.9rem;display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.badge-icon{display:inline-block;}
.rank-extra{font-size:.7rem;font-weight:800;color:var(--red);}
.actions{display:flex;align-items:center;gap:8px;margin:10px 0;}
.like-btn{background:none;border:none;cursor:pointer;padding:0;}
.like-btn svg{width:26px;height:26px;}
.desc{white-space:pre-wrap;line-height:1.5;}
</style>
</head>
<body>
<header><a href="/social/index.html">BIZIMI</a></header>
<main>
<div class="frame">
<iframe src="https://www.youtube.com/embed/8bTrqhX7nsc" allowfullscreen></iframe>
</div>
<h1>Emotional</h1>
<div class="by"><a href="/social/prospgmx/index.html" style="color:inherit;">@prospgmx</a> </div>
<div class="actions">
<button class="like-btn" id="likeBtn" onclick="toggleLike()">
<svg viewBox="0 0 24 24" id="likeSvg" fill="none" stroke="black" stroke-width="1.6"><path d="M12 21s-7.5-4.9-10-9.3C.4 8.2 2 4.5 5.6 4.5c2 0 3.5 1.1 4.4 2.6.9-1.5 2.4-2.6 4.4-2.6 3.6 0 5.2 3.7 3.6 7.2C19.5 16.1 12 21 12 21z"/></svg>
</button>
<span id="likeCount">0</span>
</div>
<div class="desc">Money and power and fame she will</div>
</main>
<script>
const API = '/social/api.php';
const USERNAME = "prospgmx";
const SLUG = "emotional";
let liked = false;

async function refreshLikeState(){
  const res = await fetch(`${API}?action=get_user&username=${encodeURIComponent(USERNAME)}`);
  const json = await res.json();
  if(!json.ok) return;
  const v = (json.data.videos || []).find(x => x.slug === SLUG);
  if(!v) return;
  document.getElementById('likeCount').textContent = v.likes || 0;
  liked = !!v.viewerLiked;
  paintLike();
}
function paintLike(){
  const svg = document.getElementById('likeSvg');
  svg.setAttribute('fill', liked ? '#D10303' : 'none');
}
async function toggleLike(){
  const res = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'like_video', username: USERNAME, slug: SLUG})});
  const json = await res.json();
  if(!json.ok){ alert(json.message || 'Please log in to like.'); return; }
  document.getElementById('likeCount').textContent = json.data.likes;
  liked = json.data.liked;
  paintLike();
}
refreshLikeState();
</script>
</body>
</html>
