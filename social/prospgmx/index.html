<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>@prospgmx — BIZIMI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#D10303;--yellow:#FFDE2C;--ink:#181818;--bg:#faf9f6;--card:#fff;--muted:#6b6b6b;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);}
a{color:inherit;text-decoration:none;}
header{position:sticky;top:0;z-index:50;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;}
header .brand{font-weight:800;font-size:1.3rem;color:#fff;}
header .brand span{color:var(--yellow);}
main{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
.profile-head{display:flex;gap:18px;align-items:center;background:var(--card);border-radius:16px;padding:22px;box-shadow:0 3px 14px rgba(0,0,0,.08);}
.profile-head img.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--yellow);}
.profile-head h1{margin:0 0 4px;font-size:1.4rem;display:flex;align-items:center;gap:6px;}
.profile-head .uname{color:var(--muted);margin:0 0 10px;}
.stats{display:flex;gap:18px;font-size:.92rem;color:var(--muted);}
.stats b{color:var(--ink);}
.badge-icon{display:inline-block;}
.rank-extra{font-size:.7rem;font-weight:800;color:var(--red);margin-left:2px;}
#followBtn{margin-top:14px;padding:9px 22px;border-radius:20px;border:0;background:var(--red);color:#fff;font-weight:700;cursor:pointer;}
#followBtn.following{background:#eee;color:var(--ink);}
.section-title{margin:30px 0 12px;font-weight:800;color:var(--red);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07);}
.card .frame{width:100%;aspect-ratio:16/9;background:#000;}
.card .frame img,.card .frame video{width:100%;height:100%;object-fit:cover;display:block;}
.card .body{padding:10px 12px;font-size:.92rem;font-weight:600;}
.empty{color:var(--muted);font-size:.9rem;}
</style>
</head>
<body>
<header>
<a href="/social/index.html" class="brand">BIZI<span>MI</span></a>
<a href="/social/index.html" style="color:#fff;font-weight:600;font-size:.9rem;">&larr; Back to feed</a>
</header>
<main>
<div class="profile-head">
<img class="avatar" src="https://i.audiomack.com/prosp-gmx/18377096-7.webp" alt="prospgmx" />
<div>
<h1>Prosp GMx <img class="badge-icon" src="/social/verifiedbadges/blue.png" width="18" height="18" alt="Verified" title="Verified" style="width:18px;height:18px;vertical-align:middle;object-fit:contain;" /></h1>
<p class="uname">@prospgmx</p>
<div class="stats">
<span><b id="followerCount">1</b> Followers</span>
<span><b id="followingCount">0</b> Following</span>
</div>
<button id="followBtn" onclick="toggleFollow()">Follow</button>
</div>
</div>

<h2 class="section-title">Videos</h2>
<div class="grid" id="videoGrid"><p class="empty">Loading…</p></div>

<h2 class="section-title">Images</h2>
<div class="grid" id="imageGrid"><p class="empty">Loading…</p></div>
</main>

<script>
const USERNAME = "prospgmx";
const API = '/social/api.php';

function escH(s){return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ytEmbedThumb(url){
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]+)/);
  return m ? `https://img.youtube.com/vi/${m[1]}/hqdefault.jpg` : null;
}

async function load(){
  const res = await fetch(`${API}?action=get_user&username=${encodeURIComponent(USERNAME)}`);
  const json = await res.json();
  if(!json.ok) return;
  const { account, videos, images, viewerFollows, isSelf } = json.data;

  document.getElementById('followerCount').textContent = account.followers.length;
  document.getElementById('followingCount').textContent = account.following.length;

  const btn = document.getElementById('followBtn');
  if (isSelf) {
    btn.style.display = 'none';
  } else {
    btn.textContent = viewerFollows ? 'Unfollow' : 'Follow';
    btn.classList.toggle('following', viewerFollows);
  }

  const vGrid = document.getElementById('videoGrid');
  vGrid.innerHTML = videos.length ? '' : '<p class="empty">No videos yet.</p>';
  videos.forEach(v => {
    const thumb = ytEmbedThumb(v.videoUrl);
    const a = document.createElement('a');
    a.href = `/social/${USERNAME}/videos/${v.slug}.html`;
    a.className = 'card';
    a.innerHTML = `<div class="frame">${thumb ? `<img src="${thumb}" loading="lazy"/>` : `<video src="${escH(v.videoUrl)}" muted></video>`}</div><div class="body">${escH(v.title)}</div>`;
    vGrid.appendChild(a);
  });

  const iGrid = document.getElementById('imageGrid');
  iGrid.innerHTML = images.length ? '' : '<p class="empty">No images yet.</p>';
  images.forEach(im => {
    const a = document.createElement('a');
    a.href = `/social/${USERNAME}/images/${im.slug}.html`;
    a.className = 'card';
    a.innerHTML = `<div class="frame"><img src="${escH(im.imageUrl)}" loading="lazy"/></div><div class="body">${escH(im.title)}</div>`;
    iGrid.appendChild(a);
  });
}

async function toggleFollow(){
  const btn = document.getElementById('followBtn');
  const following = btn.classList.contains('following');
  const action = following ? 'unfollow' : 'follow';
  const res = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action, target: USERNAME})});
  const json = await res.json();
  if(!json.ok){ alert(json.message || 'Please log in first.'); return; }
  load();
}

load();
</script>
</body>
</html>
