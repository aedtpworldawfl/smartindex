<script>
const API = '/social/api.php';
const USERNAME = "buddydml";
const SLUG = "shawty";
let liked = false;

async function refreshLikeState(){
  const res = await fetch(`${API}?action=get_user&username=${encodeURIComponent(USERNAME)}`);
  const json = await res.json();
  if(!json.ok) return;
  const v = (json.data.videos || []).find(x => x.slug === SLUG);
  if(!v) return;
  document.getElementById('likeCount').textContent = v.likes || 0;
  liked = !!v.viewerLiked;
  paintLike();
}
function paintLike(){
  const svg = document.getElementById('likeSvg');
  svg.setAttribute('fill', liked ? '#D10303' : 'none');
}
async function toggleLike(){
  const res = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'like_video', username: USERNAME, slug: SLUG})});
  const json = await res.json();
  if(!json.ok){ alert(json.message || 'Please log in to like.'); return; }
  document.getElementById('likeCount').textContent = json.data.likes;
  liked = json.data.liked;
  paintLike();
}
refreshLikeState();
</script>
