#drawerMainImage.zoomed{transform:scale(2);cursor:zoom-out}
.cart-panel{position:fixed;right:440px;top:60px;background:var(--panel);width:360px;border-radius:10px;padding:12px;box-shadow:var(--shadow);display:none;z-index:110;max-height:70vh;overflow:auto}

<script>
/* ── Config ──────────────────────────────────────── */
const ARCHIVE_BASE     = "https://archive.org/download/afmall/";
const PRODUCTS_JSON    = "products.json";
const CHECKOUT_ENDPOINT = "checkout.php";

/* EmailJS config — used ONLY to notify AFMALL that a new order came in.
   NOTE: the EmailJS dashboard template (template_opb3kxl) must have its
   "To Email" field set to {{to_email}}, "Reply To" set to {{reply_to}},
   "Subject" set to {{subject}}, and the body content set to {{message_html}}
   for these values to actually take effect — EmailJS reads the routing
   info from the template configuration, not just from the JS call. */
const EMAILJS_SERVICE_ID  = "service_d0uy87z";
const EMAILJS_TEMPLATE_ID = "template_5hkudxq";
const EMAILJS_PUBLIC_KEY  = "AShlLAQmk-VKhl0Hr";
if (window.emailjs) { emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); }

/* Static "new order" notification email body sent to AFMALL */
const ORDER_EMAIL_HTML = `
<div style="font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4;">
  <div style="max-width: 600px; margin: auto; background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h1 style="color: #D4A017; font-size: 24px; margin-bottom: 10px;">🛒 New Order Alert!</h1>
    <p style="font-size: 16px; color: #333; line-height: 1.6;">
      <b>Hey,</b><br><br>
      A Customer Has Ordered Products On <b>AFMALL</b>
    </p>
    <p style="font-size: 15px; color: #555; line-height: 1.6;">
      To view customer details and contact them, please follow the steps below:
    </p>
    <h3 style="color: #D4A017; margin-top: 25px;">How To Check Customer Details</h3>
    <ol style="text-align: left; display: inline-block; color: #333; font-size: 15px; line-height: 1.8;">
      <li>Install the AFMALL app</li>
      <li>Open the AFMALL app and go to <b>Menu</b></li>
      <li>Go to <b>Inbox</b></li>
      <li>You will see Customers and Their Details</li>
    </ol>
    <h3 style="color: #D4A017; margin-top: 25px;">What To Do Next:</h3>
    <p style="font-size: 15px; color: #555; line-height: 1.6;">
      Use their Provided Contact(s) to communicate with them.<br><br>
      You may start professionally, by telling them they have ordered product(s) on AFMALL and ask them to confirm what they have ordered and how many.<br><br>
      You should proceed with more understanding.
    </p>
    <a href="https://aedtpworld.neocities.org/apps/afmall/update/android/afmall.html"
       style="display: inline-block; margin-top: 20px; padding: 14px 28px; background-color: #D4A017; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px;">
       Install AFMALL app now
    </a>
    <p style="font-size: 12px; color: #999; margin-top: 30px;">
      [Copyright: AEDTP WORLD]
    </p>
  </div>
</div>`;

/* ── State ───────────────────────────────────────── */
let ALL_PRODUCTS = [];
let V_PRODUCTS   = [];
let PROD_MAP     = {};
let CART         = {};
let drawerQty    = 1;
let zoomed       = false;

const productsGrid    = document.getElementById("productsGrid");
const catList         = document.getElementById("catList");
const cartCountEl     = document.getElementById("cartCount");
const drawer          = document.getElementById("drawer");
const drawerMainImage = document.getElementById("drawerMainImage");

/* ── Auth: check session ─────────────────────────── */
async function checkAuth(){
  try {
    const r = await fetch('login.php?q=status');
    const d = await r.json();
    if(d.loggedIn && d.user){
      const badge = document.getElementById('userBadge');
      badge.textContent = d.user.businessname;
      badge.style.display = 'inline-block';
      document.getElementById('signInBtn').textContent = 'Account';
      document.getElementById('manageBtn').style.display = 'inline-block';
    }
  } catch(e){}
}

/* ── Load products from JSON ─────────────────────── */
async function loadProducts(){
  try {
    const r = await fetch(PRODUCTS_JSON + '?v=' + Date.now());
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    /* normalise image URLs */
    ALL_PRODUCTS = data.map(p=>({
      ...p,
      image: p.image || (ARCHIVE_BASE + (p.filename||''))
    }));
    V_PRODUCTS = ALL_PRODUCTS.slice();
    PROD_MAP   = Object.fromEntries(ALL_PRODUCTS.map(p=>[p.id,p]));
    renderCategories();
    applySort();
  } catch(e){
    productsGrid.innerHTML = `<div style="padding:24px;color:#D10303">Could not load products. Make sure products.json is accessible.</div>`;
    document.getElementById('resultsLabel').textContent = 'Error loading products';
  }
}

/* ── Render categories ───────────────────────────── */
function renderCategories(){
  catList.innerHTML = "";
  const uniqueCats = [...new Set(ALL_PRODUCTS.map(p=>p.category))];
  ["All Categories", ...uniqueCats].forEach((catName, i)=>{
    const el = document.createElement("button");
    el.className = "cat" + (i===0?" active":"");
    el.textContent = catName;
    el.addEventListener("click", ()=>{
      document.querySelectorAll(".cat").forEach(c=>c.classList.remove("active"));
      el.classList.add("active");
      V_PRODUCTS = catName==="All Categories" ? ALL_PRODUCTS.slice() : ALL_PRODUCTS.filter(p=>p.category===catName);
      renderProducts(V_PRODUCTS);
    });
    catList.appendChild(el);
  });
}

/* ── Escape ──────────────────────────────────────── */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ── Render products ─────────────────────────────── */
function renderProducts(list){
  productsGrid.innerHTML = "";
  document.getElementById('resultsLabel').textContent = list.length
    ? `${list.length} product${list.length!==1?'s':''} found`
    : 'No products found';

  if(!list.length){
    productsGrid.innerHTML = `<div style="padding:24px;color:var(--muted)">No products found</div>`;
    return;
  }
  list.forEach(p=>{
    const card = document.createElement("div"); card.className="card";
    card.innerHTML = `
      <div class="thumb"><img src="${p.image}" alt="${esc(p.title)}" loading="lazy" onerror="this.style.opacity='.3'"></div>
      <div class="title">${esc(p.title)}</div>
      <div class="meta">
        <div class="price">GHC ${Number(p.price).toFixed(2)}</div>
        <div class="badge">Fast</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-primary" onclick='openDrawer("${p.id}")'>View</button>
        <button class="btn" onclick='quickAdd("${p.id}")'>Add</button>
      </div>`;
    productsGrid.appendChild(card);
  });
}

/* ── Drawer ──────────────────────────────────────── */
function openDrawer(pid){
  const p = PROD_MAP[pid];
  if(!p) return alert("Product not available");
  document.getElementById("drawerTitle").textContent = p.title;
  document.getElementById("drawerName").textContent  = p.title;
  drawerMainImage.src = p.image;
  document.getElementById("drawerPrice").textContent    = `GHC ${Number(p.price).toFixed(2)}`;
  document.getElementById("drawerCategory").textContent = p.category;
  document.getElementById("drawerDesc").textContent     = p.desc||"";
  const thumbs = document.getElementById("drawerThumbs"); thumbs.innerHTML = "";
  ALL_PRODUCTS.filter(x=>x.category===p.category).forEach(s=>{
    const img = document.createElement("img");
    img.src = s.image; img.alt = s.title;
    img.addEventListener("click", ()=>{ drawerMainImage.src=s.image; drawerMainImage.classList.remove("zoomed"); zoomed=false; });
    thumbs.appendChild(img);
  });
  drawerQty=1; document.getElementById("drawerQty").textContent=1;
  drawer.classList.add("open"); drawer.setAttribute("aria-hidden","false");
}
function closeDrawer(){ drawer.classList.remove("open"); drawer.setAttribute("aria-hidden","true"); }
function increaseQty(){ drawerQty++; document.getElementById("drawerQty").textContent=drawerQty; }
function decreaseQty(){ if(drawerQty>1) drawerQty--; document.getElementById("drawerQty").textContent=drawerQty; }

/* ── Cart ────────────────────────────────────────── */
function quickAdd(pid){
  const p=PROD_MAP[pid]; if(!p) return;
  if(!CART[pid]) CART[pid]={product:p,qty:0};
  CART[pid].qty+=1;
  updateCartUI();
  toast(`${p.title} added`);
}
function addDrawerToCart(){
  const title=document.getElementById("drawerName").textContent;
  const p=ALL_PRODUCTS.find(x=>x.title===title); if(!p) return;
  if(!CART[p.id]) CART[p.id]={product:p,qty:0};
  CART[p.id].qty+=drawerQty;
  updateCartUI();
  toast(`${p.title} ×${drawerQty} added`);
}
function updateCartUI(){
  const count=Object.values(CART).reduce((s,i)=>s+i.qty,0);
  cartCountEl.textContent=count;
  const panel=document.getElementById("cartPanel");
  if(panel.style.display==="block") renderCartPanel();
}
function renderCartPanel(){
  const itemsWrap=document.getElementById("cartItems"); itemsWrap.innerHTML="";
  let total=0;
  Object.keys(CART).forEach(k=>{
    const {product:p,qty}=CART[k]; total+=p.price*qty;
    const div=document.createElement("div"); div.className="cart-item";
    div.innerHTML=`
      <div style="width:64px;height:64px;overflow:hidden;border-radius:8px"><img src="${p.image}" style="width:100%;height:100%;object-fit:cover"></div>
      <div style="flex:1"><div style="font-weight:700">${esc(p.title)}</div><div style="font-size:13px">GHC ${Number(p.price).toFixed(2)} × ${qty}</div></div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        <button class="btn btn-muted" onclick='changeQty("${k}",1)'>＋</button>
        <button class="btn btn-muted" onclick='changeQty("${k}",-1)'>－</button>
      </div>`;
    itemsWrap.appendChild(div);
  });
  document.getElementById("cartTotal").textContent=total.toFixed(2);
  cartCountEl.textContent=Object.values(CART).reduce((s,i)=>s+i.qty,0);
}
function changeQty(k,d){ if(!CART[k]) return; CART[k].qty+=d; if(CART[k].qty<=0) delete CART[k]; updateCartUI(); renderCartPanel(); }
function clearCart(){ CART={}; updateCartUI(); renderCartPanel(); toast("Cart cleared"); }
function toggleCart(){
  const panel=document.getElementById("cartPanel");
  panel.style.display=panel.style.display==="block"?"none":"block";
  if(panel.style.display==="block") renderCartPanel();
}

/* ── Checkout: open / close modal ────────────────── */
function proceedToCheckout(){
  if(!Object.keys(CART).length){ alert("Please add at least one product to your cart first."); return; }
  const msgEl = document.getElementById("checkoutMsg");
  msgEl.style.display = "none";
  document.getElementById("checkoutForm").reset();
  document.getElementById("checkoutModal").style.display = "flex";
}
function closeCheckout(){ document.getElementById("checkoutModal").style.display = "none"; }

function showCheckoutMsg(text, ok){
  const msgEl = document.getElementById("checkoutMsg");
  msgEl.textContent = text;
  msgEl.style.display = "block";
  msgEl.style.background = ok ? "rgba(22,163,74,.18)" : "rgba(217,4,4,.15)";
  msgEl.style.color = ok ? "#14532d" : "#7f1d1d";
}

/* ── Submit checkout: save customer + notify AFMALL by email ───── */
async function submitCheckout(){
  if(!Object.keys(CART).length){
    showCheckoutMsg("Your cart is empty.", false);
    return;
  }

  const fullname       = document.getElementById("cFullname").value.trim();
  const email          = document.getElementById("cEmail").value.trim();
  const whatsappnumber = document.getElementById("cWhatsapp").value.trim();
  const gender         = document.getElementById("cGender").value;
  const phonenumber    = document.getElementById("cPhone").value.trim();

  if(!fullname || !email){
    showCheckoutMsg("Full Name and Email are required.", false);
    return;
  }

  const btn = document.getElementById("checkoutSubmitBtn");
  const originalText = btn.textContent;
  btn.disabled = true; btn.textContent = "Submitting…";

  /* Build the products / cost / times / totalcost arrays from the cart */
  const items = Object.values(CART);
  const orderPayload = {
    fullname, email, whatsappnumber, gender, phonenumber,
    products:  items.map(i => i.product.title),
    cost:      items.map(i => Number(i.product.price)),
    times:     items.map(i => i.qty),
    totalcost: items.map(i => Number((i.product.price * i.qty).toFixed(2)))
  };

  try {
    /* 1) Save the customer + order — checkout.php writes/updates
          customers.json and regenerates customers.html */
    const r = await fetch(CHECKOUT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(orderPayload)
    });
    const d = await r.json();
    if(!d.ok) throw new Error(d.msg || "Could not save your details.");

    /* 2) Automatically notify AFMALL by email via EmailJS — no mail
          app is opened, this fires straight from the browser. */
    try {
      if(window.emailjs){
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email:     "futureinvestmentceo@gmail.com",
          reply_to:     email,
          subject:      "New Products Ordered on AFMALL",
          message_html: ORDER_EMAIL_HTML
        });
      }
    } catch(emailErr){
      console.warn("Email notification failed:", emailErr);
      /* Don't block the success flow if only the email step fails */
    }

    showCheckoutMsg("Thank you! Your order has been submitted.", true);
    clearCart();
    setTimeout(closeCheckout, 1800);
  } catch(err){
    showCheckoutMsg(err.message || "Something went wrong. Please try again.", false);
  } finally {
    btn.disabled = false; btn.textContent = originalText;
  }
}

/* ── Search / filter / sort ──────────────────────── */
function liveSearch(){
  const q=document.getElementById("globalSearch").value.trim().toLowerCase();
  V_PRODUCTS=q
    ? ALL_PRODUCTS.filter(p=>p.title.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)||(p.filename||"").includes(q))
    : ALL_PRODUCTS.slice();
  renderProducts(V_PRODUCTS);
}
function clearSearch(){ document.getElementById("globalSearch").value=""; V_PRODUCTS=ALL_PRODUCTS.slice(); renderProducts(V_PRODUCTS); }
function applyPriceFilter(){
  const min=parseFloat(document.getElementById("minPrice").value)||0;
  const max=parseFloat(document.getElementById("maxPrice").value)||999999;
  V_PRODUCTS=ALL_PRODUCTS.filter(p=>p.price>=min&&p.price<=max);
  renderProducts(V_PRODUCTS);
}
function clearPriceFilter(){ document.getElementById("minPrice").value=""; document.getElementById("maxPrice").value=""; V_PRODUCTS=ALL_PRODUCTS.slice(); renderProducts(V_PRODUCTS); }
function applySort(){
  const s=document.getElementById("sortSelect").value;
  if(s==="price-asc")  V_PRODUCTS.sort((a,b)=>a.price-b.price);
  else if(s==="price-desc") V_PRODUCTS.sort((a,b)=>b.price-a.price);
  else if(s==="name-asc")   V_PRODUCTS.sort((a,b)=>a.title.localeCompare(b.title));
  else V_PRODUCTS=ALL_PRODUCTS.slice();
  renderProducts(V_PRODUCTS);
}
function toggleSidebar(){ const s=document.getElementById("sidebar"); s.style.display=s.style.display==="none"?"flex":"none"; }

/* ── Toast ───────────────────────────────────────── */
function toast(msg,time=1500){
  const t=document.createElement("div"); t.textContent=msg;
  Object.assign(t.style,{position:"fixed",left:"50%",transform:"translateX(-50%)",bottom:"24px",background:"rgba(0,0,0,0.8)",color:"#fff",padding:"8px 12px",borderRadius:"8px",zIndex:9999,transition:"opacity .25s"});
  document.body.appendChild(t);
  setTimeout(()=>t.style.opacity="0",time-250);
  setTimeout(()=>t.remove(),time);
}

/* ── Theme ───────────────────────────────────────── */
const themeToggle=document.getElementById("darkToggle");
function setTheme(t){
  document.body.setAttribute("data-theme",t);
  themeToggle.textContent=t==="dark"?"☀️":"🌙";
  localStorage.setItem("afmall_theme",t);
}
function toggleTheme(){ setTheme(document.body.getAttribute("data-theme")==="light"?"dark":"light"); }
(function(){ setTheme(localStorage.getItem("afmall_theme")||"light"); })();

/* ── Image zoom ──────────────────────────────────── */
drawerMainImage.addEventListener("click",()=>{
  zoomed=!zoomed;
  drawerMainImage.classList.toggle("zoomed",zoomed);
});
drawerMainImage.addEventListener("dblclick",()=>{ zoomed=false; drawerMainImage.classList.remove("zoomed"); });
drawerMainImage.addEventListener("touchstart",function(e){
  if(e.touches.length!==1) return;
  if(!this._lastTap){ this._lastTap=Date.now(); return; }
  if(Date.now()-this._lastTap<300){ zoomed=false; drawerMainImage.classList.remove("zoomed"); }
  this._lastTap=Date.now();
});

/* ── Mouse-wheel horizontal scroll ──────────────── */
const grid=document.getElementById("productsGrid");
grid.addEventListener("wheel",function(e){
  if(e.deltaY===0||grid.scrollWidth<=grid.clientWidth) return;
  e.preventDefault(); grid.scrollLeft+=e.deltaY;
},{passive:false});

/* ── Keyboard shortcuts ──────────────────────────── */
document.addEventListener("keydown",e=>{
  if(e.key==="c"&&!e.ctrlKey&&!e.metaKey) toggleCart();
  if(e.key==="Escape"){ closeDrawer(); closeCheckout(); }
});

/* ── Boot ────────────────────────────────────────── */
checkAuth();
loadProducts();
</script>
